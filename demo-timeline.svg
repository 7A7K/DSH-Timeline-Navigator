<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness Timeline Navigator demo</title>
  <desc id="desc">Illustrated chat window with a searchable timeline panel on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="0.55" stop-color="#214d6b"/>
      <stop offset="1" stop-color="#0c172b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172a45" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#0d1b31" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020817" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="180" fill="#4bc9d8" opacity="0.12"/>
  <circle cx="760" cy="640" r="260" fill="#8c7cff" opacity="0.12"/>

  <rect x="42" y="38" width="1116" height="624" rx="20" fill="#f5f8ff" opacity="0.93" filter="url(#shadow)"/>
  <rect x="42" y="38" width="210" height="624" rx="20" fill="#e7eef9"/>
  <rect x="78" y="76" width="138" height="22" rx="11" fill="#153258" opacity="0.88"/>
  <text x="78" y="126" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#223b5b">会话</text>
  <rect x="72" y="154" width="148" height="40" rx="12" fill="#d2e2f5"/>
  <text x="91" y="180" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#355777">时间线演示</text>
  <rect x="72" y="208" width="148" height="40" rx="12" fill="#ffffff"/>
  <text x="91" y="234" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#6b7d93">项目说明</text>
  <rect x="72" y="262" width="148" height="40" rx="12" fill="#ffffff"/>
  <text x="91" y="288" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#6b7d93">安装与使用</text>

  <rect x="282" y="38" width="610" height="624" fill="#ffffff" opacity="0.52"/>
  <text x="324" y="92" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#263d59">DeepSeek Harness</text>
  <rect x="324" y="120" width="420" height="12" rx="6" fill="#d8e4f2"/>
  <rect x="324" y="168" width="470" height="92" rx="18" fill="#f0f5fb"/>
  <rect x="348" y="190" width="350" height="12" rx="6" fill="#bbcadb"/>
  <rect x="348" y="216" width="270" height="12" rx="6" fill="#d0dce9"/>
  <rect x="324" y="286" width="505" height="116" rx="18" fill="#e8f5f7"/>
  <rect x="348" y="310" width="410" height="12" rx="6" fill="#82c9d1"/>
  <rect x="348" y="336" width="350" height="12" rx="6" fill="#b0dfe3"/>
  <rect x="348" y="362" width="230" height="12" rx="6" fill="#c4e8ea"/>
  <rect x="324" y="432" width="450" height="12" rx="6" fill="#d8e4f2"/>
  <rect x="324" y="464" width="390" height="12" rx="6" fill="#d8e4f2"/>
  <rect x="324" y="548" width="500" height="54" rx="16" fill="#edf3fa"/>
  <text x="350" y="582" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#72859c">在长对话中继续输入……</text>

  <rect x="892" y="38" width="266" height="624" rx="20" fill="url(#panel)"/>
  <text x="922" y="84" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#f7fbff">时间线</text>
  <rect x="1090" y="62" width="38" height="28" rx="10" fill="#263d5b"/>
  <text x="1101" y="82" font-family="Segoe UI, sans-serif" font-size="15" fill="#b9c9df">↗</text>
  <rect x="918" y="112" width="206" height="38" rx="11" fill="#213957" stroke="#547292"/>
  <text x="940" y="137" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#bfd0e3">搜索消息或标题</text>

  <rect x="918" y="174" width="206" height="54" rx="12" fill="#203a59"/>
  <text x="940" y="197" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#eef6ff">▾  Turn 1</text>
  <text x="940" y="218" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9eb5cf">5 条消息</text>
  <rect x="918" y="242" width="206" height="54" rx="12" fill="#2d5574" stroke="#6ae1df" stroke-width="2"/>
  <circle cx="940" cy="269" r="6" fill="#6ae1df"/>
  <text x="956" y="266" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#f2fbff">Assistant · 当前消息</text>
  <text x="956" y="285" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#b7d8e4">点击跳转并居中</text>
  <text x="1096" y="275" font-family="Segoe UI, sans-serif" font-size="20" fill="#b8cbe0">☆</text>

  <rect x="918" y="312" width="206" height="54" rx="12" fill="#203a59"/>
  <text x="940" y="335" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#eef6ff">▸  Turn 2</text>
  <text x="940" y="356" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#9eb5cf">40 条消息</text>
  <rect x="918" y="388" width="98" height="34" rx="10" fill="#294663"/>
  <text x="938" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bfd0e3">展开全部</text>
  <rect x="1026" y="388" width="98" height="34" rx="10" fill="#294663"/>
  <text x="1040" y="410" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#bfd0e3">折叠全部</text>
  <text x="938" y="468" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#a7bdd5">★ 收藏 1</text>
  <text x="938" y="512" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#849db9">↑ 最早</text>
  <text x="1030" y="512" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#849db9">↓ 最新</text>
  <text x="918" y="608" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#7189a7">拖动左边缘调整宽度 · Esc 关闭</text>
</svg>
